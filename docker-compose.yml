version: '3.8'

services:
  frontend:
    build:
      context: ./frontend
      args:
        # Backend URL — when deployed to cloud, replace with your actual domain
        VITE_API_URL: http://localhost:5000/api
    image: agrinova-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    image: agrinova-backend
    ports:
      - "5000:5000"
    environment:
      - MONGO_URI=mongodb://mongo:27017/agrinova
      - JWT_SECRET=${JWT_SECRET:-agrinovasecret_change_in_production}
      - PORT=5000
      - NODE_ENV=production
    depends_on:
      - mongo
    restart: unless-stopped

  mongo:
    image: mongo:6
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

volumes:
  mongo_data:
