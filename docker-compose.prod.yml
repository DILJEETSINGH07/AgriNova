version: '3.8'

services:
  frontend:
    build:
      context: ./frontend
      args:
        # Pass the production API URL at build time (e.g. from GitHub Actions)
        VITE_API_URL: ${PROD_API_URL}
    image: ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/agrinova-frontend:latest
    ports:
      - "80:80"
    restart: always

  backend:
    build:
      context: ./backend
    image: ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/agrinova-backend:latest
    ports:
      - "5000:5000"
    environment:
      - MONGO_URI=${MONGO_URI}
      - JWT_SECRET=${JWT_SECRET}
      - PORT=5000
      - NODE_ENV=production
    restart: always
